<!DOCTYPE html>
<html>
<head>
    <title>Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>Cafe</h1>
        <ul>
            <li>Home</li>
            <li>Menu</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Relax with Coffee</h2>
        <p>Experience calm vibes and cute companions</p>
        <button>Explore Menu</button>
    </section>
    <section class="menu">
        <h2>Our Menu</h2>
        
        <div class="cards">
            <div class="card">
                <h3>☕ Coffee</h3>
                <p>Fresh brewed coffee</p>
                <span>₹100</span>
            </div>
        
            <div class="card">
                <h3>🍵 Tea</h3>
                <p>Refreshing herbal tea</p>
                <span>₹80</span>
            </div>
            
            <div class="card">
                <h3>🍰 Dessert</h3>
                <p>Sweet treats</p>
                <span>₹120</span>
            </div>
        </div>
    </section>
    <!-- Contact Section -->
    <section class="contact">
        <h2>Contact Us</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

</body>
</html>
